[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-image-lens"
version = "0.2.0"
description = "Experimental static depth shape heuristics for deformable objects"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["depth_image_lens*"]
